[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dft-job-submission-workflow"
version = "0.1.0"
description = "GUI workflow for assembling adsorbate-on-surface VASP jobs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "DFT Job Submission Workflow contributors"},
]
keywords = ["DFT", "VASP", "ASE", "surface", "adsorbate", "GUI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "ase>=3.23",
  "numpy>=1.24",
  "PySide6>=6.6",
  "openbabel-wheel>=3.1.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pyinstaller>=6.0",
  "pytest>=8",
]

[project.scripts]
dft-workflow = "dft_workflow.app:main"

[tool.setuptools]
packages = ["dft_workflow", "dft_workflow.Templates"]
include-package-data = true

[tool.setuptools.package-data]
dft_workflow = ["Templates/INCAR", "Templates/KPOINTS", "Templates/sub"]
